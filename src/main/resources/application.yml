spring:
  application:
    name: frota-pro-integradora-winthor

  datasource:
    url: ${ORACLE_URL}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  kafka:
    consumer:
      group-id: frota-pro-integradora-winthor-v2
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "br.com.frotasPro.api.integracao.dto,br.com.frotasPro.integradora.winthor.dto"
        spring.json.use.type.headers: false

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Um job de sync pode trazer centenas de cargas (com notas/clientes) de
      # uma vez e passar do 1MB padrão do Kafka — RecordTooLargeException.
      # Sobe o limite do produtor e comprime (JSON comprime bem, ~3-5x) pra
      # sobrar bastante margem. Precisa bater com o message.max.bytes do
      # broker/tópico em produção (ver aviso no README/infra) e com o
      # max.partition.fetch.bytes do consumidor (frota-pro-api).
      properties:
        max.request.size: 10485760
        compression.type: gzip

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,logfile
      base-path: /actuator
  endpoint:
    health:
      # só o status de cada componente (a API lê components.db.status); sem detalhes de banco/disco
      show-details: never
      show-components: always

frotapro:
  integradora:
    # Segredo exigido de quem chama a integradora (X-Integradora-Token). Mesmo valor da frota-pro-api.
    api-token: ${INTEGRADORA_API_TOKEN:}

  kafka:
    topics:
      carga-sync-request: frotapro.carga.sync.request
      carga-sync-response: frotapro.carga.sync.response
      motorista-sync-request: frotapro.motorista.sync.request
      motorista-sync-response: frotapro.motorista.sync.response
      caminhao-sync-request: frotapro.caminhao.sync.request
      caminhao-sync-response: frotapro.caminhao.sync.response

# Pool separado e pequeno pra busca sob demanda de nota fiscal/DANFE.
# Sem usuário dedicado ainda, cai nas mesmas credenciais do pool principal.
winthor:
  interativo:
    url: ${ORACLE_INTERATIVO_URL:${ORACLE_URL}}
    username: ${ORACLE_INTERATIVO_USERNAME:${ORACLE_USERNAME}}
    password: ${ORACLE_INTERATIVO_PASSWORD:${ORACLE_PASSWORD}}

resilience4j:
  circuitbreaker:
    instances:
      winthorInterativo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
  bulkhead:
    instances:
      winthorInterativo:
        max-concurrent-calls: 5
        max-wait-duration: 2s

logging:
  file:
    name: logs/frotapro-integradora.log
